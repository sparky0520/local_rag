[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-rag"
version = "1.0.0"
description = "Local-First RAG with Measured Quality"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "sentence-transformers>=3.0.0",
    "rank-bm25>=0.2.2",
    "fastapi>=0.110.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "tabulate>=0.9.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "torch>=2.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
